[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-research-scout"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31"
]

[project.optional-dependencies]
dev = [
    "pytest>=8"
]

[tool.setuptools.packages.find]
where = ["src"]